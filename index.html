<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">

  <style>
    button {
      width: 50px;
      height: 50px;
      font-size: 16px;
      margin: 3px;
      cursor: pointer;
      font-weight: bold;
      background-color: rgb(100, 96, 110);
      color: aliceblue;
    }
    input {
      width: 220px;
      height: 40px;
      font-size: 20px;
      text-align: right;
      margin-bottom: 10px;
      padding-right: 5px;

    }
  </style>
</head>
<body style="background-color: rgba(61, 71, 186, 0.662);">

    <div class="calc-screen">
    <h3 class="text-center mt-4" style="color:aliceblue; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Simple Calculator</h3>
   

    <div class="calc-body d-flex justify-content-center ">
    <div class="calc-button-row  border  m-5 p-4 bg-dark ">
  <input id="result" type="text" class="form-control text" placeholder="0"><br>
  <button id="seven" onclick="displayNumber(7)">7</button>
  <button id="eight" onclick="displayNumber(8)">8</button>
  <button id="nine" onclick="displayNumber(9)">9</button>
  <button onclick="displayNumber('*')">*</button><br>
  <button onclick="displayNumber(4)">4</button>
  <button onclick="displayNumber(5)">5</button>
  <button onclick="displayNumber(6)">6</button>
  <button onclick="displayNumber('-')">-</button><br>
  <button onclick="displayNumber(1)">1</button>
  <button onclick="displayNumber(2)">2</button>
  <button onclick="displayNumber(3)">3</button>
  <button onclick="displayNumber('+')">+</button><br>
  <button onclick="displayNumber('00')" >00</button>
  <button onclick="displayNumber(0)">0</button>
  <button onclick="displayNumber('.')">.</button>
  <button onclick="displayNumber('/')">&#247;</button><br>
  <button onclick="clearBox()" style="color: orange;">AC</button>
  <button onclick="removeLastItem()" style="color: orange;">&#9003;</button>
  <button style="width: 110px; color: orange;" onclick="evaluateExp() ;" >&#61;</button>
  </button>
        </div>
      </div>
      
  </div>
      <script src="./script.js"></script>

</body>

</html>
